# General-purpose template: choose your sensor and OpenRGB device name.
# First install creates a copy for you to edit before rerunning the installer.
# Discover psutil sensors: python3 thermal_rgb.py --list-sensors

[animation]
sensor_interval = 60.0
report_interval = 60.0
temperature_hysteresis = 2.0
diagnostics = false
breathing = false  # legacy option; animations are always disabled

[openrgb]
host = "127.0.0.1"
port = 6742

[sensors.cpu]
type = "auto_cpu"  # common AMD/Intel CPU sensors; no GPU required

# Any psutil sensor can be selected explicitly, including exposed AMD/Intel GPU
# sensors. Copy the driver and label from --list-sensors; names vary by machine.
# [sensors.case]
# type = "psutil"
# driver = "YOUR SENSOR DRIVER"
# label = "YOUR SENSOR LABEL"  # optional: filter by exact label (including "")
# index = 0                  # index within filtered entries, or driver if no label

# NVIDIA is optional. nvidia-smi is needed only when an output uses this source.
# [sensors.gpu]
# type = "nvidia"
# index = 0

[[outputs]]
name = "cpu-lighting"
sensor = "cpu"
device = "YOUR OPENRGB DEVICE NAME"  # exact match preferred; unique substring accepted
# zone = "YOUR ZONE NAME"          # omit to colour the whole device
# led_count = 8                    # optional: only resize a zone reporting zero LEDs
blue_temp = 25.0
red_temp = 90.0
brightness = 0.40

# Add further [[outputs]] tables to control more devices/zones from any source.
# Output names must be unique. Do not overlap whole-device and zone outputs.
# Legacy breath_min, breath_period, fan_interval, gpu_interval, smooth_seconds
# are still accepted but ignored. See examples/x570-rtx3080.toml for legacy config.
